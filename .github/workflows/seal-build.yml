name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Space-separated Go test names to run instead of the full suite'
        required: false
        default: ''

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build module-zip helper
        run: |
          set -eux
          HELPER=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
          cd "$HELPER"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" ./create_mod.go

      - name: Create module zip
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/out"
          # upstream ships no .github; drop this workflow and helper so they stay out of the zip
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" golang.org/x/net v0.45.0 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out/v0.45.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.45.0.zip" | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.45.0.zip
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # http2 and internal/http3 synctest-based tests are gated on
      # go1.25 || goexperiment.synctest; enable the experiment on Go 1.24.
      GOEXPERIMENT: synctest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        shell: bash
        run: |
          set -eux
          go version
          go build ./...

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          FILTER="${{ inputs.test-filter }}"
          if [ -n "$FILTER" ]; then
            go test -v -run "^($(echo "$FILTER" | tr ' ' '|'))$" ./... 2>&1 | tee "$RUNNER_TEMP/test.log"
            for t in $FILTER; do
              grep -qE "^=== RUN[[:space:]]+${t}(/|$)" "$RUNNER_TEMP/test.log" || { echo "selected test $t did not run"; exit 1; }
            done
          else
            go test -v ./... 2>&1 | tee "$RUNNER_TEMP/test.log"
          fi
          # go test's exit status already failed this step on any failure (pipefail);
          # the summary below only reports counts from the log.
          echo "===== Test summary ====="
          awk '/^(ok|FAIL|\?)[ \t]/' "$RUNNER_TEMP/test.log"
          awk '/^ok[ \t]/{p++} /--- PASS:/{t++} /--- SKIP:/{s++} /--- FAIL:/{f++}
               END {printf "Packages ok: %d\nTests passed: %d\nTests skipped: %d\nTests failed: %d\n", p, t, s, f}' "$RUNNER_TEMP/test.log"
          echo "===== Skipped tests (name + reason) ====="
          # go test -v prints a test's t.Skip reason before its "--- SKIP" line;
          # collect each test's output under the name from its "=== RUN/CONT/NAME" header.
          awk '{sub(/\r$/, "")}
               /^=== (RUN|CONT|NAME|PAUSE)/{cur=$3; next}
               /^[ \t]*--- SKIP:/{print; printf "%s", out[$3]; next}
               /^[ \t]*--- /{next}
               /^[ \t]+/ && cur != "" {out[cur]=out[cur] "      reason: " $0 "\n"}' "$RUNNER_TEMP/test.log"
